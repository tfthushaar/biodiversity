name: Detect

# Runs MegaDetector over images waiting in the database. Free: GitHub-hosted runners are
# unlimited on public repos, and the model runs on CPU through ONNX Runtime.
#
# Needs, once: the DATABASE_URL secret (Supabase session-pooler string) and the model published
# as a release (docs/models.md). Until then this workflow explains itself and exits cleanly.

on:
  schedule:
    - cron: "40 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum images to process"
        default: "2000"

concurrency:
  group: detect
  cancel-in-progress: false  # never kill a run halfway through a batch

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODEL_URL: https://github.com/${{ github.repository }}/releases/download/models-v1
    steps:
      - name: Check prerequisites
        id: pre
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! curl -fsIL "$MODEL_URL/MDV6-mit-yolov9-c.onnx" > /dev/null; then
            echo "::notice::Model release 'models-v1' not published yet (see docs/models.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.pre.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.pre.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.pre.outputs.ready == 'true'
        run: pip install -e ".[inference]"

      - name: Fetch model
        if: steps.pre.outputs.ready == 'true'
        run: |
          mkdir -p data/models
          for f in MDV6-mit-yolov9-c.onnx MDV6-mit-yolov9-c.json; do
            curl -fsSL -o "data/models/$f" "$MODEL_URL/$f"
          done
          # The sidecar records the hash the model was exported with; refuse a swapped file.
          want=$(python -c "import json;print(json.load(open('data/models/MDV6-mit-yolov9-c.json'))['onnx_sha256'])")
          got=$(sha256sum data/models/MDV6-mit-yolov9-c.onnx | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::model checksum mismatch"; exit 1; }

      - name: Detect
        if: steps.pre.outputs.ready == 'true'
        env:
          # Via the environment, never spliced into the shell script.
          LIMIT: ${{ github.event.inputs.limit || '2000' }}
        run: |
          case "$LIMIT" in ''|*[!0-9]*) echo "::error::limit must be a number"; exit 1;; esac
          python -m biodiv.workers.detect \
            --model data/models/MDV6-mit-yolov9-c.onnx \
            --limit "$LIMIT" \
            --retry-stuck
