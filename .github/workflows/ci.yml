name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests create and drop their own throwaway database on this server.
      TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

      # Run the real PostgREST (what Supabase's REST API is) against a freshly migrated database
      # and check what an anonymous visitor can and cannot do. Tests prove the database rules;
      # this proves the HTTP surface the internet actually sees.
      - name: Public API surface
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -U postgres -c "create database surface"
          DATABASE_URL=postgresql://postgres:dev@localhost:5432/surface \
            python -m biodiv.workers.migrate --seed
          psql -h localhost -U postgres -d surface \
            -c "create role authenticator login password 'dev' noinherit" \
            -c "grant anon, authenticated to authenticator"
          docker run -d --name rest --network host \
            -e PGRST_DB_URI=postgres://authenticator:dev@localhost:5432/surface \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            postgrest/postgrest
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          python scripts/smoke_rest.py http://localhost:3000
      - if: failure()
        run: docker logs rest || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
