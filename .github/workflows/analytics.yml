name: Analyse

# Refreshes the rollups and early-detection alerts. Runs after the detect workflow. Until the
# DATABASE_URL secret exists it explains itself and exits cleanly.

on:
  schedule:
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check prerequisites
        id: pre
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pre.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.pre.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.pre.outputs.ready == 'true'
        run: pip install -e .
      - if: steps.pre.outputs.ready == 'true'
        run: python -m biodiv.workers.analyse
